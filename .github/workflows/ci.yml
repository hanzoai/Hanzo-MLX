name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # mlx runs on Apple silicon and this pool is linux/amd64, so the node cannot
  # be imported or exercised here. What is checkable without the accelerator is
  # that every module still compiles and the package metadata is well formed.
  check:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q .
      # The registry reads this file; a malformed one is rejected on upload,
      # which is the failure worth catching before the upload happens.
      - run: |
          pip install --quiet packaging
          python -c "import tomllib,pathlib; from packaging.specifiers import SpecifierSet; \
            d=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']; \
            SpecifierSet(d['requires-python']); print(d['name'], d['version'])"
